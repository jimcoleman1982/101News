name: The Daily Briefing

on:
  schedule:
    # 6 runs/day at 5AM, 8AM, 11AM, 2PM, 6PM, 9PM Denver time
    # DST-aware: script detects and skips wrong timezone cron
    #
    # MDT (UTC-6, March-November):
    - cron: '7 11 * * *'    # 5:07 AM MDT
    - cron: '7 14 * * *'    # 8:07 AM MDT
    - cron: '7 17 * * *'    # 11:07 AM MDT
    - cron: '7 20 * * *'    # 2:07 PM MDT
    - cron: '7 0 * * *'     # 6:07 PM MDT
    - cron: '7 3 * * *'     # 9:07 PM MDT
    # MST (UTC-7, November-March):
    - cron: '7 12 * * *'    # 5:07 AM MST
    - cron: '7 15 * * *'    # 8:07 AM MST
    - cron: '7 18 * * *'    # 11:07 AM MST
    - cron: '7 21 * * *'    # 2:07 PM MST
    - cron: '7 1 * * *'     # 6:07 PM MST
    - cron: '7 4 * * *'     # 9:07 PM MST
  workflow_dispatch:  # Manual trigger from GitHub UI or cron-job.org
    inputs:
      dry_run:
        description: 'Dry run: select and summarize stories, print them to the log. Writes nothing.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # Needed to commit and push JSON data files
  pages: write     # Needed to request Pages rebuilds when a deploy fails
  issues: write    # Needed by the failure-notification step

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest update (with retry on failure)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/generate_digest.py --force --dry-run
            exit $?
          fi
          if python scripts/generate_digest.py --force; then
            echo "Digest generated successfully."
          else
            echo "::warning::First attempt failed. Retrying in 15 minutes..."
            sleep 900
            python scripts/generate_digest.py --force
          fi

      - name: Prune old data files (keep 14 days)
        run: |
          cd data
          ls -1 *.json 2>/dev/null | sort | head -n -14 | xargs -r rm -f

      - name: Commit and push (with retry)
        run: |
          git config user.name "Daily Briefing Bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No new data" && exit 0
          git commit -m "Update digest for $(date +%Y-%m-%d)"
          # Retry the push up to 5 times with backoff. Handles two failure modes:
          # 1. Transient GitHub server errors (e.g. "fatal error in commit_refs")
          # 2. Concurrent pushes from other workflow runs / cron triggers
          # Pull --rebase before each retry to absorb any new commits on origin.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed."
            if [ $attempt -lt 5 ]; then
              backoff=$((attempt * 30))
              echo "Pulling --rebase and retrying in ${backoff}s..."
              git pull --rebase --autostash || echo "Rebase failed -- will retry push anyway"
              sleep $backoff
            fi
          done
          echo "ERROR: All push attempts failed. The digest was generated and the"
          echo "email (if applicable) was sent, but the data was not committed to"
          echo "the repo. Investigate GitHub status or manual conflict."
          exit 1

      - name: Verify live site matches repo (rebuild Pages if not)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A successful push does not mean the site updated: GitHub's Pages
          # deploy can fail server-side afterward ("Deployment failed, try
          # again later" -- hit this repo 2026-07-05 and 2026-07-06, and
          # denver-digest 2026-07-04) and the site silently serves the
          # previous edition. Since this site publishes multiple editions
          # per day into the same date file, compare the live file's CONTENT
          # against the repo's copy; if they differ, request a fresh Pages
          # build and check again. Runs on no-op triggers too, so every
          # schedule fire doubles as a deploy health check.
          TODAY=$(TZ=America/Denver date +%F)
          URL="https://101news.org/data/${TODAY}.json"
          # Three attempts of ~6 minutes each. GitHub Pages deploys run on
          # Actions and can take 10+ minutes during an Actions slowdown
          # (2026-10-22: the deploy landed just after a 12-minute window).
          for attempt in 1 2 3; do
            for i in $(seq 1 24); do
              # Re-fetch each pass so a concurrent run pushing a newer
              # edition mid-verify doesn't cause a false mismatch.
              git fetch -q origin main
              if ! git cat-file -e "FETCH_HEAD:data/${TODAY}.json" 2>/dev/null; then
                echo "No data file for ${TODAY} on origin yet -- skipping."
                exit 0
              fi
              EXPECTED=$(git show "FETCH_HEAD:data/${TODAY}.json" | sha256sum | cut -d' ' -f1)
              # Cache-bust so the Pages CDN can't serve a stale cached copy.
              LIVE=$(curl -sf "${URL}?cb=$(date +%s)" | sha256sum | cut -d' ' -f1 || echo "fetch-failed")
              if [ "$LIVE" = "$EXPECTED" ]; then
                echo "Live site matches repo (attempt $attempt)."
                exit 0
              fi
              sleep 15
            done
            echo "Attempt $attempt: live file still does not match the repo."
            if [ $attempt -lt 3 ]; then
              # Requesting a build while one is still running cancels it
              # (2026-10-22: two in-flight deploys were cancelled this way),
              # so only request one when the latest build is finished.
              BUILD=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq .status 2>/dev/null || echo unknown)
              if [ "$BUILD" = "building" ] || [ "$BUILD" = "queued" ]; then
                echo "Pages build still ${BUILD}; waiting instead of restarting it."
              else
                echo "Latest Pages build is '${BUILD}'. Requesting a fresh one..."
                gh api "repos/${GITHUB_REPOSITORY}/pages/builds" -X POST || true
              fi
            fi
          done
          echo "ERROR: Live site is still serving stale data after repeated"
          echo "Pages rebuild requests. GitHub Pages may be having an incident."
          exit 1

      - name: Close resolved failure alerts
        # This run verified the live site matches the repo, so any open
        # failure alert from an earlier run has resolved itself.
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug'
            });
            const alerts = open.filter(i => i.title.startsWith('101News digest failure - '));
            for (const issue of alerts) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved: a later run verified the live site matches the repo. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed #${issue.number}: ${issue.title}`);
            }
            if (!alerts.length) console.log('No open failure alerts.');

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `101News digest failure - ${today}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug'
            });
            if (open.some(i => i.title === title)) {
              console.log('Issue already open for today -- not filing a duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `A step in the digest run failed -- generation, the data push, or the live-site verification. See the run log.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug']
            });
